<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
    <title>Gemini Agent Pro</title>

    <link rel="icon" href="https://www.gstatic.com/lamda/images/gemini_sparkle_v002_d4735304ff6292a690345.svg" type="image/svg+xml">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        /* ---------- CORE VARIABLES ---------- */
        :root{
            --primary: #8b5cf6;
            --primary-glow: rgba(139,92,246,0.45);
            --secondary: #06b6d4;
            --danger: #ef4444;
            --success: #10b981;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --glass-bg: rgba(15,23,42,0.62);
            --glass-border: rgba(255,255,255,0.12);
            --card-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            --input-bg: rgba(30,41,59,0.6);
            --max-ui-width: 800px;
        }

        /* ---------- BASE LAYOUT ---------- */
        html,body{
            height:100%;
            margin:0;
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
            color:var(--text-main);
            background:#020617;
            overflow: hidden;
        }

        /* ---------- DYNAMIC BACKGROUND ---------- */
        body::before{
            content:'';
            position:fixed; inset:-12%;
            z-index:-3;
            background-image:
                radial-gradient(30% 30% at 10% 10%, rgba(139,92,246,0.22) 0%, transparent 45%),
                radial-gradient(35% 35% at 90% 20%, rgba(6,182,212,0.18) 0%, transparent 50%),
                radial-gradient(40% 40% at 50% 85%, rgba(79,70,229,0.16) 0%, transparent 55%);
            filter: blur(60px);
            animation: rotateGlow 28s linear infinite;
        }
        @keyframes rotateGlow{ 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }

        /* ---------- MAIN CONTAINER ---------- */
        .app-wrap{
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:20px;
            box-sizing:border-box;
        }

        .glass-card{
            width:100%;
            max-width:var(--max-ui-width);
            border-radius:20px;
            padding:32px;
            background:var(--glass-bg);
            border:1px solid var(--glass-border);
            box-shadow:var(--card-shadow);
            text-align:center;
            backdrop-filter: blur(20px);
        }

        /* ---------- HEADER ---------- */
        h1{
            margin:0 0 16px 0;
            font-size:2.2rem;
            display:flex; align-items:center; justify-content:center; gap:12px;
        }
        .logo-text{
            background:linear-gradient(135deg,var(--primary) 0%,var(--secondary) 100%);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent; font-weight:800;
        }
        .gemini-logo{ width:42px; height:42px; animation: float 6s ease-in-out infinite; }
        @keyframes float{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }

        /* ---------- INPUT GROUP ---------- */
        .input-group{
            display:flex; align-items:center; gap:10px;
            background:var(--input-bg);
            border-radius:14px; padding:8px; margin-top:20px;
            border:1px solid var(--glass-border);
        }
        .icon-btn{ padding:10px; border-radius:10px; cursor:pointer; color:var(--text-sub); display:flex; align-items:center; justify-content:center; }
        .icon-btn:hover { color: white; background: rgba(255,255,255,0.05); }
        input[type="text"]{
            border:0; outline:0; flex:1; font-size:1rem; background:transparent; color:var(--text-main); padding:10px;
        }

        /* ---------- CONTROLS ---------- */
        .controls-row{ display:flex; gap:12px; align-items:center; justify-content:center; margin-top:20px; flex-wrap:wrap; }
        select{ background:var(--glass-bg); border:1px solid var(--glass-border); color:var(--text-main); padding:8px 12px; border-radius:10px; font-size:0.9rem; outline: none; }
        
        .switch-container{ display:flex; align-items:center; gap:8px; background:var(--glass-bg); padding:8px 12px; border-radius:10px; border:1px solid var(--glass-border); color:var(--text-sub); font-size:0.9rem; }

        .switch{ position:relative; display:inline-block; width:34px; height:20px; }
        .switch input{ opacity:0; width:0; height:0; }
        .slider{ position:absolute; inset:0; background:#64748b; border-radius:34px; transition:.25s; }
        .slider:before{ content:''; position:absolute; left:2px; bottom:2px; width:16px; height:16px; background:#fff; border-radius:50%; transition:.25s; }
        input:checked + .slider{ background:var(--success); }
        input:checked + .slider:before{ transform:translateX(14px); }

        /* ---------- STATUS & STOP ---------- */
        .status-text{ font-size:1rem; font-weight:600; color:var(--primary); margin-top:16px; }
        .stop-pill{
            display:inline-block; margin-top:16px; background: rgba(239,68,68,0.1); color:var(--danger); border:1px solid var(--danger); padding:10px 24px; border-radius:999px; font-weight:700; cursor:pointer; font-size:0.9rem;
        }

        /* ---------- LIVE CONSOLE ---------- */
        .console-area{
            margin-top:24px; background:rgba(0,0,0,0.3); border-radius:14px; border:1px solid var(--glass-border); padding:16px; font-family:monospace; font-size:0.8rem; max-height:220px; overflow-y:auto; text-align:left;
        }
        .console-header{ color:var(--primary); font-weight:bold; margin-bottom:8px; display:flex; justify-content:space-between; }
        .log-entry{ margin-bottom:4px; display:flex; gap:8px; }
        .log-time{ color:var(--text-sub); opacity:0.6; }

        /* ---------- MOBILE ---------- */
        @media (max-width: 640px){
            .glass-card{ padding:20px; }
            h1{ font-size:1.7rem; }
            .controls-row{ flex-direction: column; align-items: stretch; }
            select, .switch-container{ width: 100%; box-sizing: border-box; }
        }
    </style>
</head>
<body>
    <div class="app-wrap">
        <div class="glass-card">
            <h1>
                <img src="https://www.gstatic.com/lamda/images/gemini_sparkle_v002_d4735304ff6292a690345.svg" class="gemini-logo" alt="logo">
                Gemini<span class="logo-text">Agent Pro</span>
            </h1>

            <div class="input-group">
                <div class="icon-btn" onclick="toggleVoice()"><i class="fas fa-microphone"></i></div>
                <input type="text" id="userInput" placeholder="Ask me to explore the web..." autocomplete="off">
                <div class="icon-btn" onclick="sendTask()"><i class="fas fa-paper-plane"></i></div>
            </div>

            <div class="controls-row">
                <select id="langSelect">
                    <option value="en-US">English</option>
                    <option value="te-IN">Telugu (తెలుగు)</option>
                    <option value="hi-IN">Hindi (हिंदी)</option>
                </select>

                <div class="switch-container">
                    <label class="switch">
                        <input type="checkbox" id="visionToggle" checked>
                        <span class="slider"></span>
                    </label>
                    <span>Vision Mode</span>
                </div>

                <div class="switch-container">
                    <label class="switch">
                        <input type="checkbox" id="voiceToggle" checked>
                        <span class="slider"></span>
                    </label>
                    <span>Voice Response</span>
                </div>
            </div>

            <div id="statusText" class="status-text">Ready to assist.</div>
            <button class="stop-pill" id="stopBtn" onclick="stopTask()" style="display:none;">🛑 STOP AGENT</button>

            <!-- LIVE CONSOLE AREA -->
            <div class="console-area" id="liveConsole">
                <div class="console-header">
                    <span>📟 Live Backend Console</span>
                    <span style="font-size:0.6rem; opacity:0.5;">REAL-TIME</span>
                </div>
                <div id="consoleLogs">
                    <div style="opacity:0.4;">Waiting for backend activity...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const input = document.getElementById('userInput');
        const statusText = document.getElementById('statusText');
        const stopBtn = document.getElementById('stopBtn');
        const consoleLogs = document.getElementById('consoleLogs');

        async function sendTask() {
            const cmd = input.value.trim();
            if(!cmd) return;
            
            statusText.innerText = "Processing Command...";
            stopBtn.style.display = 'inline-block';
            
            // Note: Since we are using the extension for real browser tasks,
            // this web UI mostly acts as a dashboard or secondary input.
            // For now, it sends to the /agent endpoint.
            try {
                const res = await fetch('/agent', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        command: cmd,
                        context: "Web UI Request",
                        repeat_count: 0
                    })
                });
                const data = await res.json();
                statusText.innerText = "Task Received.";
                if(data.value) speak(data.value);
            } catch(e) {
                statusText.innerText = "Connection Error.";
            }
        }

        function stopTask() {
            stopBtn.style.display = 'none';
            statusText.innerText = "Agent Stopped.";
        }

        function toggleVoice() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if(!SR) return alert("Voice not supported.");
            const r = new SR();
            r.onresult = (e) => { input.value = e.results[0][0].transcript; sendTask(); };
            r.start();
        }

        function speak(text) {
            if(!document.getElementById('voiceToggle').checked) return;
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(new SpeechSynthesisUtterance(text));
        }

        async function fetchLogs() {
            try {
                const res = await fetch('/api/logs');
                const logs = await res.json();
                if(!logs.length) return;
                
                consoleLogs.innerHTML = logs.map(l => `
                    <div class="log-entry">
                        <span class="log-time">[${l.time}]</span>
                        <span style="color:#e2e8f0">${l.msg}</span>
                    </div>
                `).join('');
                
                const div = document.getElementById('liveConsole');
                div.scrollTop = div.scrollHeight;
            } catch(e) {}
        }

        setInterval(fetchLogs, 2000);
    </script>
</body>
</html>
