<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>AI Agent Pro · Local & Cloud LLM</title>
  <meta name="description" content="Autonomous browser AI powered by Gemma2, Qwen2.5 (offline) and Cloud Gemini.">
  <link rel="icon" href="https://www.gstatic.com/lamda/images/gemini_sparkle_v002_d4735304ff6292a690345.svg">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <style>
    /* ── TOKENS ──────────────────────────────────────────── */
    :root{
      --p:#8b5cf6; --p-glow:rgba(139,92,246,.38); --p-dim:rgba(139,92,246,.12);
      --s:#06b6d4;
      --local:#34d399; --local-dim:rgba(52,211,153,.12); --local-border:rgba(52,211,153,.35);
      --cloud:#60a5fa; --cloud-dim:rgba(96,165,250,.12);  --cloud-border:rgba(96,165,250,.35);
      --danger:#ef4444; --success:#10b981;
      --tx:#f8fafc; --tx2:#94a3b8; --tx3:#475569;
      --glass:rgba(15,23,42,.7); --gb:rgba(255,255,255,.09);
      --inp:rgba(20,30,55,.7);
      --sh:0 28px 70px -14px rgba(0,0,0,.65);
      --r:18px; --rm:12px; --rs:8px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;font-family:"Segoe UI",system-ui,sans-serif;color:var(--tx);background:#020617;overflow:hidden}

    /* animated mesh bg */
    body::before{
      content:'';position:fixed;inset:-18%;z-index:-2;
      background:
        radial-gradient(32% 32% at 12% 12%,rgba(139,92,246,.22) 0%,transparent 50%),
        radial-gradient(38% 38% at 88% 18%,rgba(6,182,212,.18) 0%,transparent 55%),
        radial-gradient(42% 42% at 50% 88%,rgba(79,70,229,.16) 0%,transparent 60%),
        radial-gradient(28% 28% at 78% 78%,rgba(52,211,153,.10) 0%,transparent 50%);
      filter:blur(75px);animation:spin 32s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}

    /* floating particles */
    body::after{
      content:'';position:fixed;inset:0;z-index:-1;
      background-image:radial-gradient(1px 1px at 20% 30%,rgba(255,255,255,.15) 0%,transparent 0%),
        radial-gradient(1px 1px at 60% 70%,rgba(255,255,255,.10) 0%,transparent 0%),
        radial-gradient(1px 1px at 80% 20%,rgba(255,255,255,.12) 0%,transparent 0%);
      animation:twinkle 6s ease-in-out infinite alternate;
    }
    @keyframes twinkle{0%{opacity:.4}100%{opacity:1}}

    /* ── WRAP ───────────────────────────────────────────── */
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}

    .card{
      width:100%;max-width:900px;
      border-radius:var(--r);padding:30px 34px;
      background:var(--glass);border:1px solid var(--gb);
      box-shadow:var(--sh);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
    }

    /* ── HEADER ─────────────────────────────────────────── */
    .hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
    .hdr-left{display:flex;align-items:center;gap:14px}
    .logo{width:44px;height:44px;animation:float 5s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
    h1{font-size:2rem;line-height:1}
    .grad{background:linear-gradient(135deg,var(--p) 0%,var(--s) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:800}
    .tagline{font-size:.72rem;color:var(--tx2);margin-top:4px;display:flex;align-items:center;gap:6px}
    .tagline-dot{width:5px;height:5px;border-radius:50%;background:var(--local);animation:blink 2s ease-in-out infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

    /* active pill */
    .active-pill{
      display:flex;align-items:center;gap:7px;
      font-size:.75rem;font-weight:700;
      padding:6px 14px;border-radius:99px;
      background:var(--local-dim);border:1px solid var(--local-border);color:var(--local);
      transition:all .4s ease;cursor:default;
    }
    .active-pill.cloud{background:var(--cloud-dim);border-color:var(--cloud-border);color:var(--cloud)}
    .active-pill i{font-size:.8rem}

    /* ── MODEL TOGGLE SECTION ───────────────────────────── */
    .model-section{margin-bottom:20px}
    .section-label{
      font-size:.68rem;text-transform:uppercase;letter-spacing:.12em;
      color:var(--tx2);margin-bottom:10px;display:flex;align-items:center;gap:8px;
    }
    .section-label::after{content:'';flex:1;height:1px;background:var(--gb)}

    .model-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

    .mcard{
      border-radius:var(--rm);padding:14px;
      border:2px solid transparent;
      background:rgba(255,255,255,.03);
      cursor:pointer;transition:all .25s ease;position:relative;overflow:hidden;
    }
    .mcard::after{
      content:'';position:absolute;inset:0;border-radius:inherit;
      background:inherit;opacity:0;transition:opacity .25s;
    }
    .mcard:hover{transform:translateY(-3px)}
    .mcard:hover::after{opacity:1}
    .mcard.local:hover{background:var(--local-dim)}
    .mcard.cloud:hover{background:var(--cloud-dim)}

    .mcard.active.local{border-color:var(--local);box-shadow:0 0 22px rgba(52,211,153,.3),inset 0 0 20px rgba(52,211,153,.05)}
    .mcard.active.cloud{border-color:var(--cloud);box-shadow:0 0 22px rgba(96,165,250,.3),inset 0 0 20px rgba(96,165,250,.05)}

    .mcard.disabled{opacity:.35;cursor:not-allowed;pointer-events:none}

    .mcard-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
    .mcard-icon{font-size:1.6rem;line-height:1}
    .mbadge{
      font-size:.58rem;font-weight:800;letter-spacing:.06em;
      padding:2px 8px;border-radius:99px;
    }
    .mbadge.local{background:var(--local-dim);color:var(--local);border:1px solid var(--local-border)}
    .mbadge.cloud{background:var(--cloud-dim);color:var(--cloud);border:1px solid var(--cloud-border)}

    .mcard-name{font-size:.9rem;font-weight:700;margin-bottom:2px}
    .mcard-sub{font-size:.7rem;color:var(--tx2);line-height:1.4}
    .mcard-status{display:flex;align-items:center;gap:5px;margin-top:8px;font-size:.68rem;color:var(--tx2)}
    .sdot{width:6px;height:6px;border-radius:50%;background:var(--tx3);flex-shrink:0}
    .sdot.on{background:var(--local);box-shadow:0 0 6px var(--local);animation:blink 2s ease-in-out infinite}
    .sdot.off{background:var(--danger)}

    /* selected checkmark */
    .mcard .check{
      position:absolute;top:10px;right:10px;
      width:20px;height:20px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      background:var(--local);color:#000;font-size:.6rem;font-weight:900;
      opacity:0;transform:scale(.4);transition:all .2s;
    }
    .mcard.active.local .check{opacity:1;transform:scale(1)}
    .mcard.active.cloud .check{opacity:1;transform:scale(1);background:var(--cloud)}

    /* shimmer skeleton */
    .shimmer{
      border-radius:var(--rm);height:100px;
      background:linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.09) 50%,rgba(255,255,255,.04) 75%);
      background-size:200% 100%;animation:sh 1.6s infinite;
    }
    @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}

    /* ── INPUT ROW ──────────────────────────────────────── */
    .inp-row{
      display:flex;align-items:center;gap:8px;
      background:var(--inp);border-radius:var(--rm);padding:6px 8px;
      border:1px solid var(--gb);transition:border-color .2s,box-shadow .2s;
    }
    .inp-row:focus-within{border-color:var(--p);box-shadow:0 0 0 3px var(--p-glow)}
    .iibtn{
      padding:10px;border-radius:9px;cursor:pointer;
      color:var(--tx2);display:flex;align-items:center;justify-content:center;
      border:none;background:transparent;font-size:1rem;transition:all .2s;
    }
    .iibtn:hover{color:#fff;background:rgba(255,255,255,.07)}
    .iibtn.rec{color:var(--danger);animation:blink 1s infinite}
    input[type=text]{
      flex:1;border:0;outline:0;font-size:1rem;
      background:transparent;color:var(--tx);padding:10px 4px;
    }
    input::placeholder{color:var(--tx3)}
    .send-btn{
      background:linear-gradient(135deg,var(--p),var(--s));
      border:none;border-radius:9px;color:#fff;
      padding:10px 18px;cursor:pointer;font-weight:700;font-size:.9rem;
      display:flex;align-items:center;gap:7px;transition:all .2s;white-space:nowrap;
    }
    .send-btn:hover{transform:scale(1.04);box-shadow:0 4px 20px var(--p-glow)}
    .send-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

    /* ── CONTROLS ───────────────────────────────────────── */
    .ctrl-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
    .chip{
      display:flex;align-items:center;gap:8px;
      background:rgba(255,255,255,.04);border:1px solid var(--gb);
      padding:7px 12px;border-radius:9px;color:var(--tx2);font-size:.82rem;cursor:default;
    }
    select{
      background:rgba(20,30,55,.8);border:1px solid var(--gb);
      color:var(--tx);padding:7px 12px;border-radius:9px;font-size:.82rem;
      outline:none;cursor:pointer;transition:border-color .2s;
    }
    select:focus{border-color:var(--p)}
    .sw{position:relative;display:inline-block;width:34px;height:20px;flex-shrink:0}
    .sw input{opacity:0;width:0;height:0}
    .slider{position:absolute;inset:0;background:#334155;border-radius:34px;transition:.25s;cursor:pointer}
    .slider::before{content:'';position:absolute;left:2px;bottom:2px;width:16px;height:16px;background:#fff;border-radius:50%;transition:.25s}
    input:checked+.slider{background:var(--success)}
    input:checked+.slider::before{transform:translateX(14px)}

    /* ── STATUS ROW ─────────────────────────────────────── */
    .status-row{display:flex;align-items:center;justify-content:space-between;margin-top:16px;flex-wrap:wrap;gap:8px}
    #statusTxt{font-size:.95rem;font-weight:600;color:var(--p);display:flex;align-items:center;gap:8px}
    .spin-icon{display:none;animation:rotate .7s linear infinite}
    @keyframes rotate{to{transform:rotate(360deg)}}
    .stop-btn{
      display:none;background:rgba(239,68,68,.12);color:var(--danger);
      border:1px solid var(--danger);padding:8px 20px;border-radius:99px;
      font-weight:700;cursor:pointer;font-size:.85rem;transition:all .2s;
    }
    .stop-btn:hover{background:rgba(239,68,68,.25)}

    /* ── CONSOLE ────────────────────────────────────────── */
    .console{
      margin-top:18px;background:rgba(0,0,0,.38);border-radius:var(--rm);
      border:1px solid var(--gb);padding:14px 16px;
      font-family:'Cascadia Code','Fira Code',monospace;font-size:.76rem;
      max-height:190px;overflow-y:auto;text-align:left;
    }
    .console-hdr{
      color:var(--p);font-weight:700;margin-bottom:10px;
      display:flex;justify-content:space-between;align-items:center;
    }
    .live-dot{
      width:6px;height:6px;border-radius:50%;
      background:var(--success);display:inline-block;margin-left:6px;
      animation:blink 1.5s ease-in-out infinite;
    }
    .le{margin-bottom:3px;display:flex;gap:8px;line-height:1.55}
    .lt{color:var(--tx2);opacity:.5;white-space:nowrap;flex-shrink:0}
    .lm-info{color:#c4b5fd}
    .lm-act{color:var(--s)}
    .lm-llm{color:var(--local)}
    .lm-err{color:var(--danger)}
    .lm-crit{color:var(--danger);font-weight:700}

    /* ── MOBILE ─────────────────────────────────────────── */
    @media(max-width:680px){
      .card{padding:18px}
      h1{font-size:1.55rem}
      .model-grid{grid-template-columns:1fr 1fr}
      .ctrl-row{flex-direction:column;align-items:stretch}
      .chip,select{width:100%}
      .hdr{flex-direction:column;align-items:flex-start}
    }
    @media(max-width:420px){.model-grid{grid-template-columns:1fr}}

    /* scrollbar */
    ::-webkit-scrollbar{width:5px}
    ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:99px}
  </style>
</head>
<body>
<div class="wrap">
<div class="card">

  <!-- HEADER -->
  <div class="hdr">
    <div class="hdr-left">
      <img src="https://www.gstatic.com/lamda/images/gemini_sparkle_v002_d4735304ff6292a690345.svg" class="logo" alt="logo">
      <div>
        <h1>AI <span class="grad">Agent Pro</span></h1>
        <div class="tagline">
          <span class="tagline-dot"></span>
          Local &amp; Cloud LLMs · Autonomous Browser Agent
        </div>
      </div>
    </div>
    <div class="active-pill" id="activePill">
      <i class="fas fa-microchip"></i>
      <span id="pillTxt">Loading…</span>
    </div>
  </div>

  <!-- MODEL SELECTOR -->
  <div class="model-section">
    <div class="section-label"><i class="fas fa-brain"></i> Choose AI Brain</div>
    <div class="model-grid" id="modelGrid">
      <div class="shimmer"></div>
      <div class="shimmer"></div>
      <div class="shimmer"></div>
    </div>
  </div>

  <!-- INPUT -->
  <div class="inp-row">
    <button class="iibtn" id="micBtn" onclick="toggleMic()" title="Voice Input">
      <i class="fas fa-microphone"></i>
    </button>
    <input type="text" id="userInput" placeholder="Ask me to browse the web, fill forms, code…"
      autocomplete="off" onkeydown="if(event.key==='Enter')sendTask()">
    <button class="send-btn" id="sendBtn" onclick="sendTask()">
      <i class="fas fa-paper-plane"></i> Send
    </button>
  </div>

  <!-- CONTROLS -->
  <div class="ctrl-row">
    <select id="langSel" title="Voice language">
      <option value="en-US">🌐 English</option>
      <option value="te-IN">🇮🇳 Telugu</option>
      <option value="hi-IN">🇮🇳 Hindi</option>
      <option value="ta-IN">🇮🇳 Tamil</option>
    </select>
    <div class="chip">
      <label class="sw"><input type="checkbox" id="visionTog" checked><span class="slider"></span></label>
      <i class="fas fa-eye"></i> Vision
    </div>
    <div class="chip">
      <label class="sw"><input type="checkbox" id="voiceTog" checked><span class="slider"></span></label>
      <i class="fas fa-volume-up"></i> Voice Out
    </div>
    <button onclick="toggleHistory()" style="background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.3);color:#c4b5fd;border-radius:9px;padding:7px 12px;cursor:pointer;font-size:.82rem;display:flex;align-items:center;gap:6px;transition:.2s" title="View history">
      <i class="fas fa-clock-rotate-left"></i> History
    </button>
  </div>

  <!-- STATUS -->
  <div class="status-row">
    <div id="statusTxt">
      <i class="fas fa-circle-notch spin-icon" id="spinIcon"></i>
      Ready to assist.
    </div>
    <button class="stop-btn" id="stopBtn" onclick="stopTask()">🛑 STOP AGENT</button>
  </div>

  <!-- CONSOLE -->
  <div class="console" id="console">
    <div class="console-hdr">
      <span>📟 Live Console <span class="live-dot"></span></span>
      <span style="font-size:.58rem;opacity:.35;">REAL-TIME</span>
    </div>
    <div id="logLines"><div style="opacity:.3">Waiting for activity…</div></div>
  </div>

</div>
</div>

<script>
// ── STATE ──────────────────────────────────────────────────
let sel  = 'gemma2';
let mods = [];
let rec  = null;
let isRunning = false;
let lastLogCount = 0;
let logPollFast  = false;
let stepNum = 0;

// ── MODEL META ─────────────────────────────────────────────
const META = {
  'gemma2':      {icon:'🦙', name:'Gemma 2',       sub:'Google · 5.4 GB · Offline', type:'local'},
  'qwen2.5':     {icon:'⚡', name:'Qwen 2.5',      sub:'Alibaba · 397 MB · Turbo',  type:'local'},
  'gemini-cloud':{icon:'✨', name:'Gemini 2.5',    sub:'Google Cloud · Latest',      type:'cloud'},
};

// ── LOAD & RENDER MODELS ───────────────────────────────────
async function loadModels(){
  try{
    const r = await fetch('/api/models');
    mods = await r.json();
    renderGrid();
  }catch(e){ console.error(e) }
}

function renderGrid(){
  const g = document.getElementById('modelGrid');
  g.innerHTML = '';
  mods.forEach(m => {
    const mt     = META[m.id] || {icon:'🤖',name:m.name,sub:'',type:'local'};
    const isAct  = m.id === sel;
    const avail  = m.available !== false;
    const isLoc  = mt.type === 'local';

    const d = document.createElement('div');
    d.className = ['mcard', isLoc?'local':'cloud', isAct?'active':'', !avail?'disabled':''].filter(Boolean).join(' ');
    d.dataset.id = m.id;
    d.onclick = () => chooseMod(m.id);

    d.innerHTML = `
      <div class="mcard-top">
        <span class="mcard-icon">${mt.icon}</span>
        <span class="mbadge ${isLoc?'local':'cloud'}">${m.badge||'LOCAL'}</span>
      </div>
      <div class="mcard-name">${mt.name}</div>
      <div class="mcard-sub">${mt.sub}</div>
      <div class="mcard-status">
        <span class="sdot ${avail?'on':'off'}"></span>
        ${avail ? 'Online · Ready' : 'Offline · Unavailable'}
      </div>
      <div class="check"><i class="fas fa-check"></i></div>
    `;
    g.appendChild(d);
  });
  updatePill();
}

function chooseMod(id){
  const m = mods.find(x=>x.id===id);
  if(!m || m.available===false) return;
  sel = id;
  renderGrid();
}

function updatePill(){
  const mt = META[sel] || {};
  const pill = document.getElementById('activePill');
  const txt  = document.getElementById('pillTxt');
  pill.className = 'active-pill' + (mt.type==='cloud'?' cloud':'');
  txt.textContent = (META[sel]?.name || sel) + (mt.type==='local' ? ' · Offline' : ' · Cloud');
}

// ── SEND / AGENTIC LOOP ────────────────────────────────────
async function sendTask(){
  const cmd = document.getElementById('userInput').value.trim();
  if(!cmd || isRunning) return;

  isRunning = true;
  stepNum   = 0;
  setStatus('Starting…', true);
  logPollFast = true;

  let lastAction = '', prevCtx = '', repeatCount = 0;
  const MAX_STEPS = 15;

  while(isRunning && stepNum < MAX_STEPS){
    stepNum++;
    setStatus(`Step ${stepNum} — Thinking…`, true);

    try{
      const r = await fetch('/agent',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          command:          cmd,
          model:            sel,
          context:          prevCtx || 'Web UI (no page context)',
          previous_context: prevCtx,
          last_action:      lastAction,
          repeat_count:     repeatCount,
          step_number:      stepNum
        })
      });
      const d = await r.json();
      const action = (d.action||'').toLowerCase();

      setStatus(`Step ${stepNum} · ${action.toUpperCase()} — ${(d.caption||'').slice(0,40)}`, true);
      if(d.value && action==='chat') speak(d.value);

      // Show coding output
      if(action === 'type' && d.value && d.value.length > 30){
        document.getElementById('statusTxt').title = 'Generated code: ' + d.value.slice(0,200);
      }

      if(action === lastAction) repeatCount++;
      else repeatCount = 0;

      lastAction = action;
      prevCtx    = `Last action: ${action} | Caption: ${d.caption||''}`;

      if(d.is_goal_achieved || action==='stop' || action==='chat' || repeatCount>=5){
        setStatus(d.caption || d.value || '✅ Goal achieved!', false);
        if(d.value && action==='chat') speak(d.value);
        break;
      }

      await new Promise(r=>setTimeout(r, 1500));
    }catch(e){
      setStatus('Connection Error: ' + e.message, false);
      break;
    }
  }

  if(stepNum >= MAX_STEPS) setStatus('⚠️ Max steps reached', false);
  isRunning   = false;
  logPollFast = false;
}

function setStatus(msg, busy){
  const st = document.getElementById('statusTxt');
  st.childNodes[st.childNodes.length-1].textContent = ' '+msg;
  document.getElementById('spinIcon').style.display  = busy ? 'inline-block' : 'none';
  document.getElementById('sendBtn').disabled        = busy;
  document.getElementById('stopBtn').style.display   = busy ? 'inline-block' : 'none';
}

function stopTask(){
  isRunning = false;
  logPollFast = false;
  setStatus('Stopped.', false);
}

// ── VOICE INPUT ────────────────────────────────────────────
function toggleMic(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ alert('Voice not supported in this browser.'); return; }
  const btn = document.getElementById('micBtn');
  if(rec){
    rec.stop(); rec=null;
    btn.classList.remove('rec');
    btn.innerHTML = '<i class="fas fa-microphone"></i>';
    return;
  }
  rec = new SR();
  rec.lang = document.getElementById('langSel').value;
  rec.continuous = false;
  rec.interimResults = true;
  btn.classList.add('rec');
  btn.innerHTML = '<i class="fas fa-circle"></i>';
  setStatus('🎙️ Listening…', false);

  rec.onresult = e => {
    const last = e.results[e.results.length-1];
    document.getElementById('userInput').value = last[0].transcript;
    if(last.isFinal){
      rec=null; btn.classList.remove('rec');
      btn.innerHTML = '<i class="fas fa-microphone"></i>';
      sendTask();
    }
  };
  rec.onerror = e => {
    rec=null; btn.classList.remove('rec');
    btn.innerHTML = '<i class="fas fa-microphone"></i>';
    setStatus('Mic error: ' + e.error, false);
  };
  rec.onend = () => {
    rec=null; btn.classList.remove('rec');
    btn.innerHTML = '<i class="fas fa-microphone"></i>';
  };
  rec.start();
}

// ── VOICE OUT ──────────────────────────────────────────────
function speak(t){
  if(!document.getElementById('voiceTog').checked) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  window.speechSynthesis.speak(u);
}

// ── LOG COLOR ──────────────────────────────────────────────
function logCls(msg){
  if(msg.includes('[CRITICAL]')) return 'lm-crit';
  if(msg.includes('[ERROR]'))    return 'lm-err';
  if(msg.includes('[ACTION]'))   return 'lm-act';
  if(msg.includes('[LLM]'))      return 'lm-llm';
  return 'lm-info';
}

// ── POLL LOGS (fast when running) ──────────────────────────
async function fetchLogs(){
  try{
    const r    = await fetch('/api/logs');
    const logs = await r.json();
    if(logs.length === lastLogCount) return;
    const ll = document.getElementById('logLines');
    ll.innerHTML = logs.map(l=>`
      <div class="le">
        <span class="lt">[${l.time}]</span>
        <span class="${logCls(l.msg)}">${esc(l.msg)}</span>
      </div>`).join('');
    const c = document.getElementById('console');
    c.scrollTop = c.scrollHeight;
    lastLogCount = logs.length;
  }catch(e){}
}

const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

// ── HISTORY PANEL (new) ────────────────────────────────────
let histVisible = false;

async function toggleHistory(){
  histVisible = !histVisible;
  let panel = document.getElementById('histPanel');
  if(!histVisible){ if(panel) panel.remove(); return; }

  // Create panel
  panel = document.createElement('div');
  panel.id = 'histPanel';
  panel.style.cssText = 'position:fixed;top:0;right:0;bottom:0;width:320px;z-index:99;background:rgba(5,10,24,.97);backdrop-filter:blur(20px);padding:16px;overflow-y:auto;border-left:1px solid rgba(255,255,255,.09)';
  panel.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <span style="font-size:.9rem;font-weight:700;color:#8b5cf6"><i class="fas fa-clock-rotate-left"></i> History</span>
      <button onclick="toggleHistory()" style="background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:7px;color:#94a3b8;padding:5px 10px;cursor:pointer;font-size:.75rem"><i class="fas fa-xmark"></i> Close</button>
    </div>
    <button id="clearAllHistBtn" onclick="clearAllHistory()" style="width:100%;padding:8px;margin-bottom:10px;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.35);color:#f87171;border-radius:8px;cursor:pointer;font-size:.78rem">
      <i class="fas fa-trash"></i> Clear All
    </button>
    <div id="histItems">Loading…</div>
  `;
  document.body.appendChild(panel);
  loadHistoryItems();
}

async function clearAllHistory(){
  try{
    await fetch('/api/history/clear', {method:'DELETE'});
    document.getElementById('histItems').innerHTML = '<div style="color:#94a3b8;font-size:.78rem;text-align:center;padding:16px">History cleared ✓</div>';
  }catch(e){
    document.getElementById('histItems').innerHTML = '<div style="color:#ef4444;font-size:.78rem">Server unreachable</div>';
  }
}

async function loadHistoryItems(){
  const cont = document.getElementById('histItems');
  try{
    const r = await fetch('/history');
    const data = await r.json();
    if(!data.length){ cont.innerHTML = '<div style="color:#94a3b8;font-size:.78rem;text-align:center;padding:16px">No history yet</div>'; return; }
    cont.innerHTML = '';
    data.forEach(item=>{
      const d = document.createElement('div');
      d.style.cssText = 'padding:9px 11px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.09);border-radius:8px;margin-bottom:6px;font-size:.78rem;cursor:pointer;transition:.18s;display:flex;justify-content:space-between;align-items:flex-start;gap:8px';
      d.onmouseenter = ()=>d.style.background='rgba(255,255,255,.07)';
      d.onmouseleave = ()=>d.style.background='rgba(255,255,255,.03)';
      const isCloud = item.model==='gemini-cloud';
      d.innerHTML = `
        <div style="flex:1;word-break:break-word;line-height:1.4;color:#f1f5f9">${esc(item.command||'')}</div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0">
          <span style="font-size:.6rem;color:#475569">${item.time||''}</span>
          <span style="font-size:.56rem;padding:1px 6px;border-radius:4px;background:${isCloud?'rgba(96,165,250,.12)':'rgba(52,211,153,.12)'};color:${isCloud?'#60a5fa':'#34d399'};border:1px solid ${isCloud?'rgba(96,165,250,.38)':'rgba(52,211,153,.38)'}">${item.model||'unknown'}</span>
          <button data-id="${esc(item.id||'')}" onclick="deleteHistItem(this)" style="background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);color:#f87171;border-radius:5px;padding:2px 7px;cursor:pointer;font-size:.6rem"><i class="fas fa-trash-can"></i></button>
        </div>
      `;
      d.querySelector('div').addEventListener('click', ()=>{
        document.getElementById('userInput').value = item.command;
        toggleHistory();
      });
      cont.appendChild(d);
    });
  }catch(e){
    cont.innerHTML = '<div style="color:#ef4444;font-size:.78rem">Could not load — is server running?</div>';
  }
}

async function deleteHistItem(btn){
  btn.stopPropagation && btn.stopPropagation();
  const itemId = btn.dataset.id;
  if(itemId) await fetch(`/api/history/${itemId}`,{method:'DELETE'}).catch(()=>{});
  const row = btn.closest('div[style]');
  if(row) row.remove();
}
