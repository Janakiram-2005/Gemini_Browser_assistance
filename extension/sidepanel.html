<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* --- RESET & BASE --- */
    body { 
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
      background: #0f172a; 
      color: #f1f5f9; 
      margin: 0; 
      padding: 16px; 
      display: flex; 
      flex-direction: column; 
      gap: 16px; 
      height: 100vh; 
      box-sizing: border-box; 
      overflow: hidden;
    }

    /* --- GLASS CARDS --- */
    .card { 
      background: rgba(30, 41, 59, 0.7); 
      border: 1px solid rgba(255, 255, 255, 0.08); 
      border-radius: 16px; 
      padding: 16px; 
      position: relative; 
      backdrop-filter: blur(12px); 
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      transition: transform 0.2s ease;
    }

    /* --- HEADER --- */
    .header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 4px;
    }
    h2 { 
      margin: 0; 
      font-size: 1.1rem; 
      background: linear-gradient(135deg, #a78bfa, #22d3ee); 
      -webkit-background-clip: text; 
      -webkit-text-fill-color: transparent; 
      font-weight: 800; 
      letter-spacing: 0.5px;
    }
    
    .icon-group { display: flex; gap: 8px; }
    .icon-btn { 
      background: rgba(255, 255, 255, 0.05); 
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      cursor: pointer; 
      color: #94a3b8; 
      font-size: 1rem; 
      padding: 6px 8px;
      transition: all 0.2s; 
    }
    .icon-btn:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
    .icon-btn.active { color: #38bdf8; border-color: #38bdf8; background: rgba(56, 189, 248, 0.1); }

    /* --- INPUT AREA --- */
    .input-wrapper { position: relative; width: 100%; }
    
    textarea { 
      width: 100%; 
      height: 70px; 
      background: rgba(15, 23, 42, 0.6); 
      border: 1px solid rgba(255, 255, 255, 0.1); 
      color: #f8fafc; 
      border-radius: 12px; 
      padding: 12px 40px 12px 12px; 
      box-sizing: border-box; 
      resize: none; 
      font-family: inherit; 
      font-size: 0.9rem;
      outline: none; 
      transition: border-color 0.2s;
    }
    textarea:focus { border-color: #8b5cf6; }
    textarea::placeholder { color: #64748b; }

    /* --- MIC BUTTON --- */
    #micBtn { 
      position: absolute; 
      bottom: 12px; 
      right: 12px; 
      background: none; 
      border: none; 
      cursor: pointer; 
      font-size: 1.2rem; 
      padding: 4px;
      border-radius: 50%;
      transition: 0.2s;
      filter: grayscale(100%);
      opacity: 0.7;
    }
    #micBtn:hover { filter: grayscale(0%); opacity: 1; background: rgba(255,255,255,0.05); }
    #micBtn.listening { 
      filter: grayscale(0%); 
      opacity: 1; 
      animation: pulse 1.5s infinite; 
    }

    /* --- ACTION BUTTONS --- */
    .btn-row { display: flex; gap: 10px; margin-top: 12px; }
    
    .main-btn { 
      flex: 1; 
      padding: 10px; 
      background: linear-gradient(90deg, #6366f1, #8b5cf6); 
      border: none; 
      color: white; 
      border-radius: 10px; 
      cursor: pointer; 
      font-weight: 600; 
      font-size: 0.9rem;
      box-shadow: 0 4px 6px -1px rgba(99, 102, 241, 0.4);
      transition: transform 0.1s, box-shadow 0.2s;
    }
    .main-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 12px -1px rgba(99, 102, 241, 0.5); }
    .main-btn:active { transform: translateY(0); }

    .stop-btn { 
      flex: 0.4;
      padding: 10px; 
      background: rgba(239, 68, 68, 0.15); 
      border: 1px solid rgba(239, 68, 68, 0.5);
      color: #f87171; 
      border-radius: 10px; 
      cursor: pointer; 
      display: none; /* Hidden by default */
      font-weight: 600;
      transition: 0.2s;
    }
    .stop-btn:hover { background: rgba(239, 68, 68, 0.25); color: #fff; }

    /* --- STATUS CARD --- */
    .status-card { margin-top: 4px; display: flex; flex-direction: column; gap: 4px; }
    .status-label { font-size: 0.7rem; color: #64748b; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; }
    #output { 
      font-size: 0.95rem; 
      color: #e2e8f0; 
      line-height: 1.5; 
      white-space: pre-wrap;
    }

    /* --- HISTORY DRAWER --- */
    #historyView { 
      display: none; 
      position: absolute; 
      top: 60px; left: 10px; right: 10px; bottom: 10px; 
      background: rgba(15, 23, 42, 0.98); 
      backdrop-filter: blur(20px);
      z-index: 50; 
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      padding: 16px; 
      overflow-y: auto; 
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      animation: slideDown 0.2s ease-out;
    }
    
    .history-item { 
      padding: 12px; 
      background: rgba(255,255,255,0.03); 
      border-radius: 8px; 
      margin-bottom: 8px; 
      border: 1px solid rgba(255,255,255,0.05); 
      font-size: 0.85rem; 
      position: relative;
    }
    .history-cmd { color: #e2e8f0; margin-right: 20px; }
    .history-del-btn { 
      position: absolute; right: 10px; top: 10px; 
      color: #ef4444; background: none; border: none; 
      cursor: pointer; font-size: 1.1rem; opacity: 0.6;
    }
    .history-del-btn:hover { opacity: 1; transform: scale(1.1); }
    
    .clear-all-btn {
      width: 100%; padding: 8px; margin-bottom: 12px;
      background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444;
      color: #ef4444; border-radius: 8px; cursor: pointer; font-size: 0.8rem;
    }

    /* --- SCROLLBAR --- */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }

    @keyframes pulse { 
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 
      70% { transform: scale(1.1); box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); } 
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } 
    }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  
  <div class="header">
    <h2>✨ Gemini Omni</h2>
    <div class="icon-group">
      <button class="icon-btn" id="historyBtn" title="View History">📂</button>
      <button class="icon-btn active" id="voiceToggle" title="Toggle Voice">🎧</button>
    </div>
  </div>

  <div class="card">
    <div class="input-wrapper">
      <textarea id="userInput" placeholder="Ask me to browse, play music, or check pages..."></textarea>
      <button id="micBtn" title="Speak Command">🎙️</button>
    </div>
    
    <div class="btn-row">
      <button id="analyzeBtn" class="main-btn">🚀 Execute</button>
      <button id="stopBtn" class="stop-btn">🛑 Stop</button>
    </div>
  </div>

  <div class="card status-card">
    <div class="status-label">Agent Status</div>
    <div id="output">Ready to assist.</div>
  </div>

  <div id="historyView">
    <div style="text-align:center; color:#94a3b8; margin-top:20px;">Loading history...</div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
